# By hand: signs an existing release's SHA256SUMS and attaches SHA256SUMS.sig, for a release
# made before build.yml signed its sums (docs/release.md, "Updates"). The signing job checks the
# release's DMG and zip against SHA256SUMS first, and signs with the EdDSA key only after the
# key matches the SUPublicEDKey of the app in that release's zip. As in build.yml, the job that
# holds the secret may only read, and the job that may write runs no code of this repository.
name: sign-sums

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, such as v1.3.1"
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the release and check its sums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          mkdir rel
          gh release download "$TAG" -R "$REPO" -D rel -p SHA256SUMS -p Slipstream.dmg -p Slipstream.zip
          (cd rel && shasum -a 256 -c SHA256SUMS)
          unzip -p rel/Slipstream.zip Slipstream.app/Contents/Info.plist > rel/Info.plist
          key=$(plutil -extract SUPublicEDKey raw rel/Info.plist)
          [[ -n "$key" ]] || { echo "the app in $TAG has no SUPublicEDKey" >&2; exit 1; }
          echo "KEY=$key" >> "$GITHUB_ENV"

      - name: Sign the sums
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: swift tools/sign.swift rel/SHA256SUMS "$KEY" rel/SHA256SUMS.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sums-signature
          path: rel/SHA256SUMS.sig

  attach:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sums-signature
      - name: Attach SHA256SUMS.sig to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          test -s SHA256SUMS.sig
          gh release upload "$TAG" SHA256SUMS.sig -R "$REPO" --clobber
