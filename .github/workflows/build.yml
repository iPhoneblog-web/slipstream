# Every push and pull request: the tests of the app and of the core (core/, Go: Linux and macOS,
# its ffmpeg tests in the toolchain image, its Linux image built and started), then a signed and
# notarised build on Apple Silicon with the core inside. One tag `v<major>.<minor>.<patch>` releases
# all of Slipstream at that version (docs/release.md): the image ghcr.io/kyrios/slipstream:v<…>,
# the tag core/v<…> for Go's module, and the release, with release-notes/<version>.md in the
# appcast and above the install steps (a tag without it fails at once): Slipstream.dmg,
# Slipstream.zip, slipstream-darwin-arm64, slipstream-linux-amd64, appcast.xml, SHA256SUMS and
# SHA256SUMS.sig, under names that stay the same, so .../releases/latest/download/ is always the
# newest (Sparkle reads appcast.xml there). A manual run of sign-sums.yml signs an older
# release's SHA256SUMS.
#
# Nothing runs beside a secret it does not need: the tests see no secret; the signing job has
# the keychain and the notary key but only read access to the repository; the image job may
# write packages only, and only on a tag after the signed build; only the publishing job may write
# the repository, and it runs no code of this repository. Actions are pinned by commit.
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sysctl -n machdep.cpu.brand_string
      - name: Test
        run: swift test
      # A release needs its notes, for Sparkle's update dialog and the GitHub release
      # (docs/release.md, "Release notes"): checked before anything is built.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: swift run release-notes "$GITHUB_REF_NAME"
      # The extension's origin checks (docs/traps.md, "Origins") on the real scripts.
      - name: Test the extension
        run: node --test Tests/extension/*.test.mjs

  # The core (core/, Go; core/README.md): on Linux and on the Mac, where its darwin files
  # (CPU time, efficiency cores) are compiled and tested for real.
  core-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: The core's control API is valid OpenAPI 3.1
        if: runner.os == 'Linux'
        run: npx --yes @redocly/cli@1.25.0 lint api/worker-control.yaml

  # The core's tests that run ffmpeg, with the toolchain's own (encode-toolchain 3, the build
  # every worker runs). EQ_REQUIRE_REAL_FFMPEG=1 makes a missing ffmpeg fail them instead of
  # skipping them. They run as uid 1001, not root: as root a read-only folder is writable, and
  # a test's premise is gone.
  core-real-ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/kyrios/encode-toolchain:3@sha256:90d801a26a7e695c3b64434bac97f4e95d3d0df664f25c264ae7dc3dc83f502e
    env:
      EQ_REQUIRE_REAL_FFMPEG: "1"
    steps:
      - name: A C compiler for -race, and git for the checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: core/go.mod
          cache: false
      - name: The worker's tests with the toolchain's ffmpeg
        run: |
          ffmpeg -hide_banner -version | head -1
          mkdir -p /tmp/u && chown -R 1001:1001 /tmp/u "$GITHUB_WORKSPACE"
          cd core
          setpriv --reuid=1001 --regid=1001 --clear-groups \
            env HOME=/tmp/u GOPATH=/tmp/u/go GOCACHE=/tmp/u/cache PATH="$PATH" EQ_REQUIRE_REAL_FFMPEG=1 \
            go test -race -count=1 ./worker/

  # The core's Linux image (core/Dockerfile) builds and starts, and its tools are there. Not
  # pushed here.
  core-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: core
          file: core/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          tags: slipstream:ci
          cache-from: type=gha,scope=core-image
          cache-to: type=gha,mode=max,scope=core-image
      - name: The image starts, and the worker's tools are there
        run: |
          docker run --rm slipstream:ci --version
          docker run --rm --entrypoint encode-worker slipstream:ci --version
          docker run --rm slipstream:ci versions | tee versions.json
          for t in ffmpeg libx265 libx264 whisper.cpp qwen-asr; do jq -e --arg t "$t" '.tools[] | select(.name == $t)' versions.json >/dev/null; done
          jq -e '.fonts | index("Inter ExtraBold")' versions.json >/dev/null

  build:
    needs: [test, core-test, core-real-ffmpeg]
    runs-on: macos-15
    env:
      # A pull request from a fork gets no secrets; it builds and signs ad hoc.
      HAS_SECRETS: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # bin/package reads the last tag and the commit count

      - name: Toolchain
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Before any secret is on the runner: this fetches and runs downloaded binaries, and the
      # core's modules (bin/package builds the core with the app's version).
      - name: Fetch the core's modules and its tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd core && go mod download)
          bin/fetch-tools

      # On a tag, before any secret: the version's notes as HTML for the appcast and as Markdown
      # for the release (docs/release.md, "Release notes").
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: swift run release-notes "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes"

      - name: Signing identity and notary key
        if: env.HAS_SECRETS == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          print -r -- "$P12" | base64 -D > "$RUNNER_TEMP/id.p12"
          # The .p12 has no password.
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -c "Developer ID Application"
          # The key as the .p8 text, or base64 of it.
          if [[ "$P8" == -----BEGIN* ]]; then print -r -- "$P8" > "$RUNNER_TEMP/notary.p8"
          else print -r -- "$P8" | base64 -D > "$RUNNER_TEMP/notary.p8"; fi
        shell: zsh {0}

      - name: Build, sign, notarise, pack
        env:
          SIGN_IDENTITY: ${{ env.HAS_SECRETS == 'true' && 'Developer ID Application' || '-' }}
          NOTARY_KEY: ${{ env.HAS_SECRETS == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          REQUIRE_WORKER: "1"
          REQUIRE_UPDATES: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: bin/package --no-test

      # On a tag: the Sparkle appcast for this release's zip, and SHA256SUMS.sig for the sums,
      # both signed with the EdDSA key, which exists only as this secret (docs/release.md,
      # "Updates"). Each tool checks its signature against the app's SUPublicEDKey first.
      - name: Appcast and signed sums
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SECRETS == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          info=dist/Slipstream.app/Contents/Info.plist
          cp "$RUNNER_TEMP/notes/release-notes.md" dist/
          swift tools/appcast.swift dist/Slipstream.zip "$(plutil -extract CFBundleShortVersionString raw $info)" \
            "$(plutil -extract CFBundleVersion raw $info)" "https://github.com/$REPO/releases/download/$TAG/Slipstream.zip" \
            "$(plutil -extract SUPublicEDKey raw $info)" "$RUNNER_TEMP/notes/release-notes.html" dist/appcast.xml
          swift tools/sign.swift dist/SHA256SUMS "$(plutil -extract SUPublicEDKey raw $info)" dist/SHA256SUMS.sig

      - name: Remove the signing keychain
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Verify the signed build
        if: env.HAS_SECRETS == 'true'
        run: |
          dmg=$(ls dist/*.dmg)
          codesign --verify --strict --deep --verbose=2 dist/Slipstream.app
          spctl -a -vv dist/Slipstream.app
          # Apple's ticket service drops a connection now and then: try again.
          for f in dist/Slipstream.app "$dmg"; do
            for i in 1 2 3 4 5; do xcrun stapler validate "$f" && break; [ $i = 5 ] && exit 1; sleep 20; done
          done
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          codesign -dv --verbose=2 dist/Slipstream.app 2>&1 | grep -E 'TeamIdentifier|Runtime|Timestamp'
          ls dist/Slipstream.app/Contents/Helpers

      - name: Launch check (Settings opens)
        run: bin/check-launch

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slipstream
          path: |
            dist/*.dmg
            dist/*.zip
            dist/slipstream-*
            dist/appcast.xml
            dist/release-notes.md
            dist/SHA256SUMS
            dist/SHA256SUMS.sig

  # On a tag, after the signed build: the image built and tested above (the same layers, from the
  # cache), pushed as ghcr.io/kyrios/slipstream:<tag>. infra pins it by digest.
  core-publish-image:
    needs: [build, core-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: core
          file: core/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/kyrios/slipstream:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT AND GPL-3.0-or-later AND GPL-2.0-or-later AND LGPL-2.0-or-later AND BSD-2-Clause-Patent
          cache-from: type=gha,scope=core-image
      - run: echo "ghcr.io/kyrios/slipstream:${{ github.ref_name }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, core-publish-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slipstream
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test -s release-notes.md || { echo "no release-notes.md: the release would say nothing of what changed" >&2; exit 1; }
          {
            cat release-notes.md
            echo
            echo "Slipstream ${TAG#v} for Macs with Apple Silicon, macOS 14 or later."
            echo
            echo "The same Slipstream on Linux: the image \`ghcr.io/kyrios/slipstream:${TAG}\` (linux/amd64), or"
            echo "the core alone, **slipstream-linux-amd64** and **slipstream-darwin-arm64** below, which need"
            echo "encode-queue's toolchain beside them ([core/README.md](https://github.com/${REPO}/blob/${TAG}/core/README.md))."
            echo
            echo "Download **Slipstream.dmg**, open it and drag the app onto Programme. Installed"
            echo "copies update themselves (Sparkle, appcast.xml below). Signed with a Developer ID"
            echo "and notarised. Install steps: [README](https://github.com/${REPO}/blob/${TAG}/README.md#install)."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md
          test -s appcast.xml || { echo "no appcast.xml: installed copies would not see this release" >&2; exit 1; }
          test -s SHA256SUMS.sig || { echo "no SHA256SUMS.sig: a mirror could not check the sums" >&2; exit 1; }
          test -s slipstream-linux-amd64 && test -s slipstream-darwin-arm64 || { echo "no core binaries: the release would carry only the Mac app" >&2; exit 1; }
          gh release create "$TAG" Slipstream.dmg Slipstream.zip slipstream-darwin-arm64 slipstream-linux-amd64 \
            appcast.xml SHA256SUMS SHA256SUMS.sig -R "$REPO" \
            --title "Slipstream ${TAG#v}" --notes-file ../notes.md --verify-tag --latest
          # Go reads a module in a subfolder at a tag with its folder's name: encode-queue imports
          # github.com/kyrios/slipstream/core at core/<tag>.
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/core/$TAG" -f sha="$GITHUB_SHA" >/dev/null
