# The Xcode project: `xcodegen` makes Slipstream.xcodeproj from this file (bin/package runs it).
# Safari loads a web extension only from inside an app, and only xcodebuild builds that app
# extension, so the app is an Xcode project; its code that needs no app lives in Package.swift.
name: Slipstream
options:
  bundleIdPrefix: io.github.kyrios
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    # The maintainer's paid team. Never 2X64N8XML3, the free team the Apple Development certificate
    # belongs to (docs/release.md).
    DEVELOPMENT_TEAM: W9N692KH39
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # bin/package signs, inside out, with the identity it is given (docs/release.md).
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    DEAD_CODE_STRIPPING: YES
    STRIP_INSTALLED_PRODUCT: YES
    COPY_PHASE_STRIP: YES
    # Sparkle's EdDSA public key (base64, 32 bytes): the app installs only updates it signs. Its
    # private key is the repository secret SPARKLE_ED_PRIVATE_KEY and nowhere else
    # (docs/release.md, "Updates"). Empty: bin/package refuses a release.
    SPARKLE_PUBLIC_ED_KEY: "wiLD4GVCTBpaU7Q6zL+PkFmt8YxgZHYLLvWK4zZhgkg="
packages:
  Slipstream:
    path: .
  # Updates (docs/release.md, "Updates"). A release some weeks old, pinned exactly.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Slipstream:
    type: application
    platform: macOS
    # The app icon is App/Slipstream/Assets.xcassets/AppIcon.appiconset: full-bleed squares,
    # which macOS 26 masks itself (a pre-masked .icns lands in a grey frame there).
    # Resources/AppIcon.png is its 1024-pixel source.
    sources:
      - App/Slipstream
    # xcodegen writes the Info.plist from these properties and its defaults, like the
    # entitlements below.
    info:
      path: App/Slipstream/Info.plist
      properties:
        CFBundleDisplayName: Slipstream
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        LSUIElement: true
        # The connect link a Funkhaus offers, slipstream://connect?site=<host>
        # (docs/funkhaus-api.md, "Connect link").
        CFBundleURLTypes:
          - CFBundleURLName: io.github.kyrios.slipstream.connect
            CFBundleURLSchemes: [slipstream]
        # Sparkle: the appcast every release publishes beside its DMG, checked once a day.
        SUFeedURL: https://github.com/kyrios/slipstream/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSHumanReadableCopyright: kyrios/slipstream
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    # xcodegen writes these files from `properties`; without them it writes them empty.
    entitlements:
      path: App/Slipstream/Slipstream.entitlements
      properties:
        com.apple.security.application-groups:
          - W9N692KH39.io.github.kyrios.slipstream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kyrios.slipstream
        PRODUCT_NAME: Slipstream
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Slipstream
        product: DropCore
      - package: Slipstream
        product: HelperCore
      - package: Sparkle
        product: Sparkle
      - target: SlipstreamExtension
        embed: true
  SlipstreamExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension/Handler
      - path: Extension/Resources
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Slipstream
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/SlipstreamExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - W9N692KH39.io.github.kyrios.slipstream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kyrios.slipstream.extension
        PRODUCT_NAME: Slipstream Extension
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Slipstream:
    build:
      targets:
        Slipstream: all
